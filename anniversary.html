<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紀念日 | Trust and Guard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/character.css?v=6">
    <link rel="stylesheet" href="css/anniversary.css?v=1">
</head>
<body>
<main class="page">

    <header class="topbar">
        <a class="back" href="index.html">←</a>
        <span class="kicker">ANNIVERSARY</span>
        <span class="page-title">紀念日</span>
    </header>

    <section class="head">
        <p class="head-kicker">ANNIVERSARY</p>
        <h1 class="head-title">紀念日</h1>
    </section>

    <section class="cal-wrap">
        <div class="cal">
            <div class="cal-head">
                <button class="nav" id="prevBtn" type="button" aria-label="上個月">
                    <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M7 1L1 7L7 13" stroke="#d9c7a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="cal-title">
                    <span class="en" id="monthEn"></span>
                    <span class="cn" id="monthCn"></span>
                </div>
                <button class="nav" id="nextBtn" type="button" aria-label="下個月">
                    <svg width="8" height="14" viewBox="0 0 8 14" fill="none" aria-hidden="true"><path d="M1 1L7 7L1 13" stroke="#d9c7a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
            <div class="weekdays" aria-hidden="true">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="rule"></div>
            <div class="days" id="days"></div>
            <div class="legend">
                <span class="lg"><i class="ring"></i>紀念日</span>
                <span class="lg"><i class="dot"></i>選取中</span>
            </div>
            <span class="corners" aria-hidden="true"></span>
        </div>
    </section>

    <section class="detail-wrap">
        <div class="detail">
            <div class="detail-head">
                <span class="d-date" id="dDate"></span>
                <span class="d-tag" id="dTag">每年</span>
            </div>
            <h2 class="d-title" id="dTitle"></h2>
            <p class="d-sub" id="dSub"></p>
            <p class="d-text" id="dText"></p>
        </div>
    </section>

    <section class="list-wrap">
        <h2 class="list-title"><span class="cn">本月紀念日</span><span class="en">This month</span></h2>
        <ul class="rows" id="rows"></ul>
    </section>

    <footer class="foot">
        <a href="index.html">← 回到首頁</a>
        <small>此網頁為同人作品，角色版權屬鷹角網路所有</small>
    </footer>

</main>
<audio id="bgm" src="audio/theme.mp3" loop preload="none"></audio>
<script src="js/anniversary.js?v=1"></script>
</body>
</html>
